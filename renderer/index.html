<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'">
  <title>Stormo</title>
  <link rel="stylesheet" href="app://stormo/node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <svg id="fm-defs" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="fm-brand" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8b5cf6"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/>
      </linearGradient>
      <radialGradient id="fm-brand-shine" cx=".28" cy=".18" r=".85">
        <stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
    </defs>
  </svg>
  <div class="stage" id="app" data-theme="dark">
    <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
    <header class="titlebar" id="titlebar"></header>
    <div class="body">
      <nav class="dock" id="dock" aria-label="Modes"></nav>
      <aside class="sidebar panel-glass" id="rail" aria-label="Sidebar"></aside>
      <main class="center" id="center">
        <div class="center-view" id="center-code"></div>
        <div class="center-view" id="center-agent"></div>
        <div class="center-view" id="center-thread"></div>
        <div class="center-view" id="center-auto"></div>
      </main>
      <aside class="side panel-glass" id="side" aria-label="Right sidebar"></aside>
    </div>
  </div>
  <script src="app://stormo/node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="app://stormo/node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="app://stormo/node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="app://stormo/node_modules/@xterm/addon-unicode11/lib/addon-unicode11.js"></script>
  <script src="app://stormo/node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
